[package]
name = "desktop-pet-clipboard"
version = "0.2.0"
description = "桌面宠物剪贴板"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
fuzzy-matcher = "0.3"
dirs = "5"

[target."cfg(target_os = \"macos\")".dependencies]
# orderBack 沉底直接走 libobjc FFI，无需 crate

[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
]

[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
