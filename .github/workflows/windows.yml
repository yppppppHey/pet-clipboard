# Windows CI：全量自动化测试 + NSIS 打包 + Release 上传
#
# 触发：push 到 main、push tag(v*)、PR、手动。测试全部通过后才打包；
# 任一层失败整条流水线标红——等价于在真实 Windows 机器上执行全量回测。
# tag 构建在测试与打包全部通过后，把 NSIS 安装包附到同名 GitHub Release
# （Release 已存在则 --clobber 覆盖同名资产，不存在则创建）。
#
# 注：打包步骤用 npm 分发的 tauri CLI（`tauri build`），与 make_app.ps1 的
# `cargo tauri build` 是同一个 CLI 的另一种分发方式，可免去 CI 每次编译
# cargo-tauri 的数分钟开销；产物输出路径完全一致。

name: Windows CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# tag 构建需要写权限把安装包上传到 Release
permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: 全量测试 + NSIS 打包
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust（stable / MSVC）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- 阶段 1：低成本测试先跑，失败最快暴露 ----
      - name: 前端逻辑测试（搜索竞态/去抖/重复提交等）
        run: node --test tests/frontend.test.cjs

      - name: Windows 原生契约 + 打包脚本回归
        run: python -m unittest discover -s tests -p "test_*_windows.py" -v

      # ---- 阶段 2：Rust ----
      - name: Rust 单元测试（store/快捷键状态机/几何纯函数）
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # ---- 阶段 3：NSIS 打包（等价 make_app.ps1 的 build 步骤）----
      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: NSIS 打包（Release）
        run: tauri build

      # 产物不存在视为打包失败（if-no-files-found: error）
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # ---- 阶段 4（仅 tag 构建）：附上安装包到 GitHub Release ----
      - name: 附上安装包到 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' |
            Sort-Object -Property LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "没有找到 NSIS 产物，无法发布 Release 资产" }
          Write-Host "==> 产物：$($exe.Name)"
          # Release 已存在则覆盖上传；不存在时 upload 会失败，降级为创建。
          # 不做 view 预检：其结果不可靠（曾出现 30s 超时返回非零导致误走创建分支）。
          gh release upload $tag $exe.FullName --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "==> upload 未命中（exit=$LASTEXITCODE），尝试创建 Release $tag"
            gh release create $tag $exe.FullName --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Release 资产发布失败（exit=$LASTEXITCODE）" }
          Write-Host "==> Release 资产上传完成"
