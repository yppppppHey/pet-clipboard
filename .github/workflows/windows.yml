# Windows CI：全量自动化测试 + NSIS 打包（对应系分 §11 测试矩阵 / §11.2 回测闭环）
#
# 触发：push 到 main、PR、手动。测试全部通过后才打包；
# 任一层失败整条流水线标红——等价于在真实 Windows 机器上执行全量回测。
#
# 注：打包步骤用 npm 分发的 tauri CLI（`tauri build`），与 make_app.ps1 的
# `cargo tauri build` 是同一个 CLI 的另一种分发方式，可免去 CI 每次编译
# cargo-tauri 的数分钟开销；产物输出路径完全一致。

name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: 全量测试 + NSIS 打包
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust（stable / MSVC）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- 阶段 1：低成本测试先跑，失败最快暴露 ----
      - name: 前端逻辑测试（搜索竞态/去抖/重复提交等）
        run: node --test tests/frontend.test.cjs

      - name: Windows 原生契约 + 打包脚本回归
        run: python -m unittest discover -s tests -p "test_*_windows.py" -v

      # ---- 阶段 2：Rust ----
      - name: Rust 单元测试（store/快捷键状态机/几何纯函数）
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # ---- 阶段 3：NSIS 打包（等价 make_app.ps1 的 build 步骤）----
      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: NSIS 打包（Release）
        run: tauri build

      # 产物不存在视为打包失败（if-no-files-found: error）
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
